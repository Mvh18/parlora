# Dependabot version updates. Security updates are not delayed by the
# cooldown; version updates wait seven days so a compromised release is
# usually caught before it is proposed here.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The runtime lines are pinned by .python-version (3.12) and .nvmrc (24 LTS)
    # and move only by an explicit decision; patch updates still arrive. Node
    # 25+ also dropped the bundled corepack the Dev Container uses for pnpm.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
