- name: phase/8
  color: "5319E7"
  description: Extras

# priority
- name: priority/p0
  color: "B60205"
  description: Blocker
- name: priority/p1
  color: "D93F0B"
  description: High
- name: priority/p2
  color: "FBCA04"
  description: Medium
- name: priority/p3
  color: "0E8A16"
  description: Nice to have

# status
- name: status/needs-triage
  color: "EDEDED"
  description: New, not reviewed yet
- name: status/blocked
  color: "EDEDED"
  description: Waiting on something else
- name: status/in-progress
  color: "EDEDED"
  description: Someone is working on it

# community
- name: good first issue
  color: "7057FF"
  description: Small, well-scoped and a good entry point
- name: help wanted
  color: "008672"
  description: Contributions welcome

# automation
- name: dependencies
  color: "0366D6"
  description: Dependency update (Dependabot)
