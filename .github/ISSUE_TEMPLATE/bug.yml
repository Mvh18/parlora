name: Bug
description: Behaviour that is incorrect, broken or diverges from what was specified.
title: "[Bug] "
labels: [type/bug, status/needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must not be reported here: use the private
        vulnerability report linked from the issue chooser. Never attach real
        voice recordings or transcripts.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and how badly (crash, wrong correction, latency, data loss).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU and driver, Docker Desktop version, browser, Parlora version or commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with any personal data removed.
      render: text
