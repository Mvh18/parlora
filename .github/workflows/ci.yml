name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --locked / --frozen-lockfile fail when a manifest drifted from its lockfile
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run just lint
      - run: uv run just typecheck

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked
      # Hypothesis tests plus the 95 % line and branch coverage gate
      - run: uv run just test-core

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked
      # Unit, integration (PostgreSQL via Testcontainers) and contract tests,
      # plus the 85 % line and branch coverage gate
      - run: uv run just test-server

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked
      # Fails with a diff when contracts/openapi.json drifts from the code
      - run: uv run python scripts/export_openapi.py --check

  repo:
    name: repo invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run just test-repo

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the compose configuration
        run: |
          docker compose -f compose.yaml -f compose.nogpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml -f compose.nogpu.yaml config --quiet
      - name: Start the stack without a GPU
        run: docker compose -f compose.yaml -f compose.nogpu.yaml up --detach --build --wait
      - name: The runtime image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' parlora-server)"
          echo "image user: ${user:-<unset>}"
          case "$user" in "" | root | 0 | 0:*) exit 1 ;; esac
      - name: Smoke-test the server
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8700/api/v1/health/live
          curl --fail --silent --show-error http://127.0.0.1:8700/api/v1/health/ready
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose --profile '*' down --volumes

  devcontainer:
    name: dev container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Dev Container image
        run: docker build --tag parlora-devcontainer .devcontainer
      - name: Check the toolchain inside it
        run: >-
          docker run --rm parlora-devcontainer bash -euo pipefail -c
          'uv --version && python --version && node --version && pnpm --version
          && just --version && gh --version && docker --version'

  security:
    name: security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, core, server, contract, repo, docker, devcontainer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
