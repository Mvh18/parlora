[project]
name = "parlora-workspace"
version = "0.3.0"
description = "Workspace root for Parlora: shared tooling and repository checks."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    # The HTTP client behind Starlette's TestClient (httpx is deprecated there).
    "httpx2>=2.13.1",
    "hypothesis>=6.140",
    "import-linter>=2.5",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pip-licenses>=5.0",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    # Workspace members, installed editable so their suites run from the root.
    "parlora-core",
    "parlora-server",
    "pyyaml>=6.0",
    "ruff>=0.17",
    # The `just` binary from PyPI, so CI and contributors outside the Dev
    # Container run the same recipes with `uv run just <recipe>`.
    "rust-just>=1.58",
    # PostgreSQL in throwaway containers for the server's integration tests.
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0",
    "zizmor>=1.10",
]

[tool.uv]
# The root only carries tooling; packages live in the workspace members.
package = false
# Supply-chain delay: ignore releases younger than a week (pnpm does the same
# through minimumReleaseAge).
exclude-newer = "7 days"
# Security fixes skip the delay, as Dependabot's cooldown does: pin the cut-off
# for the patched package to the day of the fix and drop the entry once the
# release is older than a week.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", virtualenv = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z" }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/web"]

[tool.uv.sources]
parlora-core = { workspace = true }
parlora-server = { workspace = true }

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".devcontainer"]
# First-party import roots of the workspace members (src layout).
src = [".", "packages/core/src", "apps/server/src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PT",      # pytest style
    "S",       # bandit (security)
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and repository checks call git with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
"**/tests/**" = ["S101"]
# Dev scripts run tools with fixed arguments built in the script itself.
"scripts/**" = ["S603"]
# Domain errors are named after the rule they enforce, as the domain-core spec does.
"packages/core/src/parlora_core/errors.py" = ["N818"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Typed `__init__` for pydantic models and settings (incl. `_env_file`).
plugins = ["pydantic.mypy"]
files = [
    "tests",
    "scripts",
    "packages/core/src",
    "packages/core/tests",
    "apps/server/src",
    "apps/server/tests",
    "apps/server/alembic/env.py",
]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "unit: fast, isolated tests",
    "integration: tests that need real services (Docker, PostgreSQL)",
    "contract: API contract checks (OpenAPI, generated clients)",
    "gpu: tests that need an NVIDIA GPU; excluded in CI",
    "slow: tests that take more than a few seconds",
]

# ── coverage ────────────────────────────────────────────────────────────────
# Per-package thresholds are set by the test recipes of each package.
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# ── import-linter ───────────────────────────────────────────────────────────
# The domain core stays framework-free (design D5), and the server is layered:
# a layer may import the layers below it, never the ones above.
[tool.importlinter]
root_packages = ["parlora_core", "parlora_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "parlora_core is framework-free"
type = "forbidden"
source_modules = ["parlora_core"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "pipecat", "parlora_server"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "parlora_server layers"
type = "layers"
containers = ["parlora_server"]
layers = ["main", "api", "db", "config"]
